title: notes.keiran.io
tagline: Another attempt to consolidate some of my various published and presented content…
description: >-
  Another attempt to consolidate some of my various published and presented content

url: "https://notes.keiran.io"

github:
  username: keirans

social:
  name: Keiran
  email: ""
  links:
    - https://github.com/keirans

